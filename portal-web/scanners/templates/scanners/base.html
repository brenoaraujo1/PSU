<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}PSU - Portal de Segurança Unificado{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" crossorigin="anonymous">
  <style>
    body { background: #f4f6f9; }
    .scan-output { background: #0f172a; color: #e2e8f0; border-radius: .5rem; padding: 1rem; max-height: 60vh; overflow: auto; white-space: pre-wrap; font-size: .85rem; }
    .badge-status { min-width: 6.5rem; }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
      <a class="navbar-brand fw-semibold" href="{% url 'dashboard' %}">PSU</a>
      <div class="navbar-nav me-auto">
        <a class="nav-link" href="{% url 'dashboard' %}">Scans</a>
        {% if user.is_staff %}<a class="nav-link" href="{% url 'admin:index' %}">Administração</a>{% endif %}
      </div>
      {% if user.is_authenticated %}
        <span class="navbar-text me-3">{{ user.get_username }}</span>
        <form method="post" action="{% url 'logout' %}" class="d-inline">
          {% csrf_token %}
          <button class="btn btn-outline-light btn-sm" type="submit">Sair</button>
        </form>
      {% endif %}
    </div>
  </nav>

  <main class="container pb-5">
    {% if messages %}
      {% for message in messages %}
        <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags|default:'info' }}{% endif %} alert-dismissible fade show" role="alert">
          {{ message }}
          <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
        </div>
      {% endfor %}
    {% endif %}

    {% block content %}{% endblock %}
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
