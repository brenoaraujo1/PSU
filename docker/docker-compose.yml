##Docker Compose para o Painel de Segurança Personalizado Administração Pública MT

networks:
  security-net:
    driver: bridge

services:
  postgres:
    image: postgres:15-alpine
    container_name: security-db
    environment:
      POSTGRES_DB: security_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: YourSecurePassword
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - security-net

  redis:
    image: redis:7-alpine
    container_name: security-redis
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - security-net

  web-portal:
    build: ./portal-web
    container_name: security-portal
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./portal-web:/app
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DB_HOST=postgres
      - DB_NAME=security_db
      - DB_USER=postgres
      - DB_PASSWORD=YourSecurePassword
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - security-net

  celery-worker:
    build: ./portal-web
    container_name: security-worker
    command: celery -A portal_web worker --loglevel=info
    volumes:
      - ./portal-web:/app
    cap_add:
      - NET_RAW
      - NET_ADMIN
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DB_HOST=postgres
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - security-net

  defectdojo:
    image: defectdojo/defectdojo-django:latest
    container_name: defectdojo
    ports:
      - "8080:8080"
    environment:
      - DD_DATABASE_URL=postgres://postgres:YourSecurePassword@postgres:5432/security_db
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - security-net

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheusdata:/prometheus
    ports:
      - "9090:9090"
    networks:
      - security-net

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_AUTH_ANONYMOUS_ENABLED=true
    volumes:
      - grafanadata:/var/lib/grafana
    networks:
      - security-net

volumes:
  pgdata:
  redisdata:
  prometheusdata:
  grafanadata: