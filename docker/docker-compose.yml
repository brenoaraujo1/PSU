# Docker Compose para o Painel de Seguranca Personalizado Administracao Publica MT

networks:
  security-net:
    driver: bridge

services:
  # 1. Banco de Dados Central
  postgres:
    image: postgres:15-alpine
    container_name: security-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - security-net

  # 2. Redis (Fila de tarefas para o Celery)
  redis:
    image: redis:7-alpine
    container_name: security-redis
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - security-net

  # 3. Aplicacao Django Customizada (Web Portal)
  web-portal:
    build: ../portal-web
    container_name: security-portal
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ../portal-web:/app
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DB_HOST=postgres
      - DB_NAME=${POSTGRES_DB}
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${DB_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - security-net

  # 4. Celery Worker (Executa Nmap, Gobuster e Nuclei em segundo plano)
  celery-worker:
    build: ../portal-web
    container_name: security-worker
    command: celery -A portal_web worker --loglevel=info
    volumes:
      - ../portal-web:/app
    cap_add:
      - NET_RAW
      - NET_ADMIN
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DB_HOST=postgres
      - DB_NAME=${POSTGRES_DB}
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${DB_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - security-net

  # 5. DefectDojo (Gestao e API de Vulnerabilidades)
  defectdojo:
    image: defectdojo/defectdojo-django:latest
    container_name: defectdojo
    environment:
      - DD_DATABASE_URL=postgres://${POSTGRES_USER}:${DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - DD_ALLOWED_HOSTS=*
      - DD_UWSGI_MODE=http
      - DD_SECRET_KEY=sua_chave_secreta_aqui_12345
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - security-net

  # Proxy Web do DefectDojo
  defectdojo-nginx:
    image: defectdojo/defectdojo-nginx:latest
    container_name: defectdojo-nginx
    ports:
      - "8080:8080"
    environment:
      - DD_UWSGI_HOST=defectdojo
      - DD_UWSGI_PORT=3031
    depends_on:
      - defectdojo
    networks:
      - security-net

  # 6. Prometheus (Coletor de metricas do servidor)
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheusdata:/prometheus
    ports:
      - "9091:9090"
    networks:
      - security-net

  # 7. Grafana (Dashboard para integracao)
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_AUTH_ANONYMOUS_ENABLED=true
    volumes:
      - grafanadata:/var/lib/grafana
    networks:
      - security-net

volumes:
  pgdata:
  redisdata:
  prometheusdata:
  grafanadata:
